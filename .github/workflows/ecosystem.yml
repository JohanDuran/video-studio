# Checks the plugin against the MangoAI and media-toolbox releases it pins (versions.json). See ECOSYSTEM.md.
name: ecosystem
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/check-ecosystem.mjs
        env: { GITHUB_TOKEN: '${{ github.token }}' }
